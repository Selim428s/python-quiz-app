name: Build Android APK

on:
push:
branches: [ "main", "master" ]
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

steps:
- uses: actions/checkout@v4

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.10'

- name: Install dependencies
  run: |
    pip install --upgrade pip
    pip install "buildozer<1.6.0" "cython<3.0.0"
    sudo apt-get update || true
    sudo apt-get install -y --fix-missing build-essential libssl-dev libffi-dev python3-dev gzip zip unzip openjdk-17-jdk git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libtool autoconf automake pkg-config aidl

- name: Accept Android Licenses & Fix SDK
  run: |
    mkdir -p /home/runner/.android
    echo "24330f855fa5e8865f33d9e36563e3d64c153725" > /home/runner/.android/repositories.cfg
    mkdir -p /usr/lib/android-sdk/licenses
    echo -e "\n84831b84090f7a274b14e82684b377d62910d762" > /usr/lib/android-sdk/licenses/android-sdk-license
    echo -e "\nd56f5187479451eabf01fb78af6dfcb131a648db" >> /usr/lib/android-sdk/licenses/android-sdk-license
    echo -e "\n24330f855fa5e8865f33d9e36563e3d64c153725" > /usr/lib/android-sdk/licenses/android-sdk-preview-license

- name: Build with Buildozer
  run: |
    buildozer init
    sed -i 's/#android.api = 33/android.api = 31/g' buildozer.spec
    sed -i 's/android.api = 33/android.api = 31/g' buildozer.spec
    sed -i 's/#android.sdk = 31/android.sdk = 31/g' buildozer.spec
    sed -i 's/android.sdk = 31/android.sdk = 31/g' buildozer.spec
    sed -i 's/#android.min_api = 21/android.min_api = 21/g' buildozer.spec
    sed -i 's/#android.build_tools_version =.*/android.build_tools_version = 31.0.0/g' buildozer.spec
    buildozer -y android debug

- name: Upload APK
  uses: actions/upload-artifact@v4
  with:
    name: QuizApp-APK
    path: bin/*.apk
