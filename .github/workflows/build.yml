name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential

      - name: Buildozer kurulumu
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3" setuptools

      - name: Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: APK derle
        run: buildozer -v android debug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: python-sinavi-apk
          path: bin/*.apk
