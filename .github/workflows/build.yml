name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install "buildozer<1.6.0" "cython<3.0.0"
        sudo apt-get update || true
        sudo apt-get install -y --fix-missing build-essential libssl-dev libffi-dev python3-dev gzip zip unzip openjdk-17-jdk git ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libtool autoconf automake pkg-config aidl

    - name: Build with Buildozer
      run: |
        buildozer init
        sed -i 's/android.api = 33/android.api = 31/g' buildozer.spec
        buildozer -y android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: QuizApp-APK
        path: bin/*.apk
